<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sandbox</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f0f0f;
    font-family:Segoe UI,sans-serif;

    /* отключение выделения и зума */
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
}

#toggle{
    position:fixed;
    top:15px;
    right:15px;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#dc143c;
    color:#fff;
    font-size:18px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#clear{
    position:fixed;
    top:15px;
    right:75px;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#444;
    color:#fff;
    font-size:18px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

textarea{
    width:100%;
    height:100vh;
    border:none;
    outline:none;
    resize:none;
    box-sizing:border-box;
    padding:20px;
    padding-top:80px; /* чтобы текст не уходил под кнопки */
    background:#1f1f1f;
    color:#fff;
    font-size:16px; /* важно: меньше 16px на iPhone вызывает зум */
    font-family:monospace;
}

iframe{
    width:100%;
    height:100vh;
    border:none;
    display:none;
    background:#fff;
}
</style>
</head>

<body>

<button id="toggle" aria-label="Переключить режим">
    <i class="fa-solid fa-play" id="toggleIcon"></i>
</button>

<button id="clear" aria-label="Очистить код">
    <i class="fa-solid fa-trash"></i>
</button>

<textarea id="code" spellcheck="false"></textarea>

<iframe id="preview"></iframe>

<script>
const btn = document.getElementById("toggle");
const toggleIcon = document.getElementById("toggleIcon");
const clearBtn = document.getElementById("clear");
const code = document.getElementById("code");
const preview = document.getElementById("preview");

let mode = "edit";

function update(){
    preview.srcdoc = code.value;
}

code.addEventListener("input", update);

btn.addEventListener("click", () => {

    if(mode === "edit"){
        mode = "preview";
        code.style.display = "none";
        preview.style.display = "block";
        toggleIcon.className = "fa-solid fa-pen";
        update();
    }else{
        mode = "edit";
        code.style.display = "block";
        preview.style.display = "none";
        toggleIcon.className = "fa-solid fa-play";
    }

});

clearBtn.addEventListener("click", () => {
    code.value = "";
    update();
    code.focus();
});
</script>

</body>
</html>
