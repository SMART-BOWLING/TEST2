<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox</title>

<style>
    body {
        margin: 0;
        font-family: Segoe UI, sans-serif;
        background: #0f0f0f;
        height: 100vh;
        overflow: hidden;
    }

    /* круглая кнопка */
    #toggle {
        position: fixed;
        top: 15px;
        right: 15px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: none;
        background: #dc143c;
        color: white;
        font-size: 18px;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* редактор */
    textarea {
        width: 100%;
        height: 100vh;
        background: #1f1f1f;
        color: white;
        border: none;
        outline: none;
        padding: 20px;
        font-size: 14px;
        box-sizing: border-box;
    }

    /* preview */
    iframe {
        width: 100%;
        height: 100vh;
        border: none;
        display: none;
        background: white;
    }
</style>
</head>

<body>

<button id="toggle">▶</button>

<textarea id="code">
<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    text-align: center;
    padding: 50px;
}
h1 { color: red; }
</style>
</head>
<body>
<h1>Привет</h1>
<p>HTML Sandbox</p>
</body>
</html>
</textarea>

<iframe id="preview"></iframe>

<script>
const btn = document.getElementById("toggle");
const code = document.getElementById("code");
const preview = document.getElementById("preview");

let mode = "edit";

function update() {
    preview.srcdoc = code.value;
}

code.addEventListener("input", update);
update();

btn.addEventListener("click", () => {
    if (mode === "edit") {
        mode = "preview";
        code.style.display = "none";
        preview.style.display = "block";
        btn.textContent = "✎";
        update();
    } else {
        mode = "edit";
        code.style.display = "block";
        preview.style.display = "none";
        btn.textContent = "▶";
    }
});
</script>

</body>
</html>
